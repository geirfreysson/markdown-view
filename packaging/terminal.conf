# App-owned configuration; never loads standalone Ghostty startup commands.
font-family = Menlo
font-size = 13
background = #1e1e1e
foreground = #eeeeee
cursor-style = block
cursor-style-blink = false
window-padding-x = 8
window-padding-y = 8
scrollback-limit = 10000000
shell-integration = none
confirm-close-surface = false
clipboard-read = deny
clipboard-write = allow
